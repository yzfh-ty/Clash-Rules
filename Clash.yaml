# Mihomo (Clash.Meta) configuration converted from Shadowrocket.conf
# Replace the subscription URL before runtime testing.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
tcp-concurrent: true
ipv6: false

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  route-exclude-address:
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 255.255.255.255/32
    - 239.255.255.250/32

hosts:
  'localhost': 127.0.0.1
  'localhost.weixin.qq.com': 127.0.0.1

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  nameserver:
    - 'https://cloudflare-dns.com/dns-query#PROXY'
    - 'https://dns.google/dns-query#PROXY'
  nameserver-policy:
    '+.local': [system]
    '+.in-addr.arpa': [system]
    '+.ip6.arpa': [system]
    '+.icloud-content.com': [system]
    '+.apple-cloudkit.com': [system]
    '+.cdn-apple.com': [system]
    '+.xhscdn.com':
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
    '+.xiaohongshu.com':
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: false
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.in-addr.arpa'
    - '*.ip6.arpa'
    - 'localhost'
    - 'localhost.weixin.qq.com'
    - 'dns.weixin.qq.com'
    - 'dns.weixin.qq.com.cn'
    - 'multimedia.nt.qq.com.cn'
    - 'qpic.cn'
    - '*.qpic.cn'
    - 'qlogo.cn'
    - '*.qlogo.cn'
    - '*.icloud-content.com'
    - '*.apple-cloudkit.com'
    - '*.cdn-apple.com'

proxy-providers:
  subscription:
    type: http
    url: 'https://example.com/replace-with-your-subscription-url'
    path: ./proxies/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      lazy: false
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000

# PROXY models Shadowrocket's current proxy independently of 节点选择.
proxy-groups:
- name: PROXY
  type: select
  use:
  - subscription
- name: 🚀 节点选择
  type: select
  proxies:
  - ✋ 手动选择
  - ⚡ 自动选择
  - DIRECT
  - REJECT
- name: ✋ 手动选择
  type: select
  proxies:
  - PROXY
  use:
  - subscription
- name: ⚡ 自动选择
  type: url-test
  use:
  - subscription
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 0
  timeout: 5000
  lazy: false
  filter: .+
- name: 🧱 DNS 防泄露
  type: select
  proxies:
  - REJECT
  - 🚀 节点选择
  - DIRECT
- name: 🛡️ WebRTC 防泄露
  type: select
  proxies:
  - REJECT
  - 🚀 节点选择
  - PROXY
  - DIRECT
- name: 🤖 AI 服务
  type: select
  proxies:
  - 🚀 节点选择
  - PROXY
  - DIRECT
  - REJECT
- name: 🍏 苹果服务
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - PROXY
  - REJECT
- name: 🍎 苹果推送
  type: select
  proxies:
  - 🚀 节点选择
  - PROXY
  - DIRECT
  - REJECT
- name: 🏦 汇丰香港
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - PROXY
  - REJECT
- name: 🏦 香港银行
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - PROXY
  - REJECT
- name: 📈 券商服务
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  - PROXY
  - REJECT
- name: 🏠 私有网络
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - REJECT
- name: 🔒 国内服务
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - REJECT
- name: 🌍 非中国
  type: select
  proxies:
  - PROXY
  - 🚀 节点选择
  - ⚡ 自动选择
  - DIRECT
  - REJECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - PROXY
  - 🚀 节点选择
  - ⚡ 自动选择
  - DIRECT
  - REJECT
